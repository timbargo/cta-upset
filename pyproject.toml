[project]
name = "cta-upset"
version = "0.1.0"
description = "Predict CTA bus delays before you board - anomaly detection and forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "requests>=2.34.2",
]

[project.scripts]
cta-upset = "cta_upset.main:main"
